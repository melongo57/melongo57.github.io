# Despliegue de Mi Garaje en Netlify.

[build]
  command = "npm run build"
  publish = "dist"

# Las rutas de la app son del lado del cliente: /agenda, /vehiculos/:id... no
# existen como archivos. Sin este redirect, entrar directamente en cualquiera
# de ellas (o recargar) daría un 404 del servidor antes de que React Router
# llegue a decidir nada.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker NO se cachea. Si el navegador sirve un sw.js viejo desde
# caché, la app se queda clavada en una versión antigua y el aviso de
# actualización no llega nunca.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Los assets van con hash en el nombre, así que se pueden cachear para
# siempre: un cambio produce un nombre nuevo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
